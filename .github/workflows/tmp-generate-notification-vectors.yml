name: tmp-generate-notification-vectors

on:
  push:
    branches:
      - android/v0.1.1-tile-notification-sync
    paths:
      - .github/workflows/tmp-generate-notification-vectors.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/v0.1.1-tile-notification-sync

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pillow

      - name: Decode launcher PNGs for inspection
        shell: bash
        run: |
          mkdir -p /tmp/icon-preview
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('app/src/main/res/drawable')
          out = Path('/tmp/icon-preview')

          for name in ('ic_launcher_red_dot_foreground.png', 'ic_launcher_wordmark_foreground.png'):
              image = Image.open(root / name).convert('RGBA')
              data = list(image.getdata())
              alpha = [p[3] for p in data]
              visible = [p for p in data if p[3] > 0]
              print(name, 'size=', image.size, 'alpha=', min(alpha), max(alpha), 'visible=', len(visible))
              print('common=', Counter(visible).most_common(12))
              print('extrema=', image.getextrema())

              # Save canonical decode and a gray-background preview.
              image.save(out / name)
              bg = Image.new('RGBA', image.size, (80, 80, 80, 255))
              bg.alpha_composite(image)
              bg.convert('RGB').resize((640, 640)).save(out / (name.replace('.png', '_preview.png')))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: icon-preview
          path: /tmp/icon-preview
