name: tmp-generate-notification-vectors

on:
  push:
    branches:
      - android/v0.1.1-tile-notification-sync
    paths:
      - .github/workflows/tmp-generate-notification-vectors.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/v0.1.1-tile-notification-sync

      - name: Recover launcher PNGs with ffmpeg
        shell: bash
        run: |
          set -x
          mkdir -p /tmp/icon-preview
          for f in ic_launcher_red_dot_foreground.png ic_launcher_wordmark_foreground.png; do
            src="app/src/main/res/drawable/$f"
            dst="/tmp/icon-preview/$f"
            ffmpeg -y -v warning -i "$src" -frames:v 1 "$dst" || true
            file "$src" || true
            if [ -f "$dst" ]; then file "$dst"; fi
          done

      - name: Make visible previews
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/icon-preview')
          for p in root.glob('*.png'):
              try:
                  im=Image.open(p).convert('RGBA')
                  bg=Image.new('RGBA', im.size, (80,80,80,255))
                  bg.alpha_composite(im)
                  bg.convert('RGB').resize((640,640)).save(root/(p.stem+'_preview.jpg'), quality=95)
                  print(p.name, im.size, im.getbbox(), im.getextrema())
              except Exception as e:
                  print(p.name, 'preview failed', repr(e))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: icon-preview-ffmpeg
          path: /tmp/icon-preview
