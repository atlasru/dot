name: patch-v0010
on:
  push:
    branches: [ agent/v0.0.10-about ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.0.10 patch
        run: python tools/patch_v0010.py
      - name: Commit generated changes
        run: |
          git config user.name "dot. build bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/dev/dotclient/android/ui/DotApp.kt
          git commit -m "Add About screen" || exit 0
          git push
