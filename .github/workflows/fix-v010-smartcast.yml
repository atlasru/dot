name: fix-v010-smartcast

on:
  push:
    branches: [ agent/android-v0.1.0-happ-experiment ]
    paths:
      - 'tools/fix_v010_smartcast.py'
      - '.github/workflows/fix-v010-smartcast.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-v0.1.0-happ-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_v010_smartcast.py
      - name: Commit fix
        run: |
          git config user.name "atlasru"
          git config user.email "258285264+atlasru@users.noreply.github.com"
          git add app/src/main/java/dev/dotclient/android/ui/DotApp.kt
          git commit -m "Fix Android 0.1.0 selected profile smart cast"
          git push
