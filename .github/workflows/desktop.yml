name: desktop

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable

      - name: Reject unfinished product markers
        shell: pwsh
        run: |
          $files = Get-ChildItem src,src-tauri/src -Recurse -File
          $hits = $files | Select-String -Pattern 'TODO|FIXME|todo!\(|unimplemented!\('
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_ }
            throw 'Desktop product sources contain unfinished implementation markers.'
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Read Desktop version
        id: desktop-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          npm run check-version

      - name: Prepare Xray runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/runtime | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'xray.zip'
          $out = Join-Path $env:RUNNER_TEMP 'xray-runtime'
          Invoke-WebRequest -Uri 'https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-windows-64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $xray = Get-ChildItem -Path $out -Recurse -Filter 'xray.exe' | Select-Object -First 1
          $wintun = Get-ChildItem -Path $out -Recurse -Filter 'wintun.dll' | Select-Object -First 1
          if (-not $xray -or -not $wintun) { throw 'Xray runtime archive is missing xray.exe or wintun.dll' }
          Copy-Item $xray.FullName src-tauri/runtime/xray.exe -Force
          Copy-Item $wintun.FullName src-tauri/runtime/wintun.dll -Force

      - name: Generate Windows icons
        run: npm run icons

      - name: Rust unit and Xray compatibility tests
        env:
          DOT_XRAY_EXE: ${{ github.workspace }}\desktop\src-tauri\runtime\xray.exe
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend build
        run: npm run build

      - name: Compile Tauri executable
        run: npm run tauri -- build --no-bundle

      - name: Assemble portable package
        shell: pwsh
        run: |
          $portable = 'portable'
          Remove-Item $portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$portable/runtime" | Out-Null
          Copy-Item 'src-tauri/target/release/dot-desktop.exe' "$portable/dot-desktop.exe" -Force
          Copy-Item 'src-tauri/runtime/xray.exe' "$portable/runtime/xray.exe" -Force
          Copy-Item 'src-tauri/runtime/wintun.dll' "$portable/runtime/wintun.dll" -Force
          Get-ChildItem $portable -Recurse | Format-Table FullName, Length

      - name: Verify portable release archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          @{ version = $version; source = $env:GITHUB_SHA; configuration = 'release'; signing = 'unsigned' } | ConvertTo-Json | Set-Content portable/BUILD.json -Encoding utf8
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $zip = "release-assets/dot-desktop-$version-windows-x64.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip
          python ../scripts/verify-portable.py $zip .
          if ($LASTEXITCODE -ne 0) { throw 'Portable validation failed' }
          $signature = Get-AuthenticodeSignature src-tauri/target/release/dot-desktop.exe
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected signing status: $($signature.Status)" }
          $env:GITHUB_SHA | Set-Content release-assets/desktop-source.txt

      - name: Upload desktop portable build
        uses: actions/upload-artifact@v4
        with:
          name: dot-desktop-build
          path: desktop/release-assets/
          if-no-files-found: error

      - name: Upload dependency locks for bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: dot-desktop-lockfiles
          path: |
            desktop/package-lock.json
            desktop/src-tauri/Cargo.lock
