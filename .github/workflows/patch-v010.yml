name: patch-v010

on:
  push:
    branches: [ agent/android-v0.1.0-happ-experiment ]
    paths:
      - 'tools/patch_v010.py'
      - '.github/workflows/patch-v010.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-v0.1.0-happ-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_v010.py
      - name: Commit generated changes
        run: |
          git config user.name "atlasru"
          git config user.email "258285264+atlasru@users.noreply.github.com"
          git add app CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Android 0.1.0: unified orb and node dashboard"
            git push
          fi
