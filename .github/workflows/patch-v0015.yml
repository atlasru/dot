name: patch-v0015

on:
  push:
    branches: [ agent/android-v0.0.15-node-test-icons ]
    paths:
      - 'tools/patch_v0015.py'
      - '.github/workflows/patch-v0015.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-v0.0.15-node-test-icons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_v0015.py
      - name: Commit generated changes
        run: |
          git config user.name "atlasru"
          git config user.email "258285264+atlasru@users.noreply.github.com"
          git add app CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Android 0.0.15: node URL test and launcher icons"
            git push
          fi
