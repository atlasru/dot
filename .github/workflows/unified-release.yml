name: unified-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Select an existing version tag in the UI. Branch dispatches cannot publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unified source
        run: python3 scripts/verify-release.py
      - name: Validate production tag
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fx "v$version" existing-tags.txt; then
            echo 'Release already exists; inspect it instead of overwriting.' >&2
            exit 1
          fi

  android:
    needs: source
    uses: ./.github/workflows/android.yml

  windows:
    needs: source
    uses: ./.github/workflows/desktop.yml

  assets:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dot-*-build
          path: release-assets
          merge-multiple: true
      - name: Verify provenance, archive and calculate exact hashes
        run: python3 scripts/release-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: unified-release-candidate
          path: |
            release-assets/*.apk
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-notes.md
          if-no-files-found: error

  promote:
    # An explicit reviewed release request is the only main-branch promotion path.
    # Both platform builds and the exact archive/checksum gate have already passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create requested tag from validated main and dispatch tag build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/release-request.json || exit 0
          tag=$(python3 -c 'import json; print(json.load(open(".github/release-request.json"))["tag"])')
          version=$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')
          test "$tag" = "v$version"
          # One-time recovery of the unpublished v0.4.0 tag whose Windows test
          # server inherited nonblocking mode. Never replace any other tag.
          repair_from=""
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fx "refs/tags/$tag" tags.txt; then
            current=$(git rev-parse "refs/tags/$tag")
            if test "$tag" = "v0.4.0" && test "$current" = "e6fb58ea7525a6154e54aef51f89b1ce64ee42e1"; then
              repair_from="$current"
            else
              echo 'Requested tag already exists; no automatic changes.'
              exit 0
            fi
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fx "$tag" releases.txt; then exit 1; fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if test -n "$repair_from"; then
            git merge-base --is-ancestor "$repair_from" "$GITHUB_SHA"
            git push --force-with-lease="refs/tags/$tag:$repair_from" origin "$GITHUB_SHA:refs/tags/$tag"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          # GITHUB_TOKEN tag pushes do not trigger push workflows; dispatch explicitly.
          gh workflow run unified-release.yml --ref "$tag"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unified-release-candidate
          path: candidate
      - name: Publish validated tag and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')
          tag="v$version"
          test "$GITHUB_REF" = "refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > existing-tags.txt
          if grep -Fx "$tag" existing-tags.txt; then exit 1; fi
          cd candidate/release-assets
          sha256sum --check SHA256SUMS
          # Stage assets before exposing a public release. Never clobber an existing release.
          gh release create "$tag" *.apk *.zip SHA256SUMS --verify-tag --draft \
            --title "dot. $tag" --notes-file ../release-notes.md
          mkdir ../../uploaded
          gh release download "$tag" --dir ../../uploaded
          (cd ../../uploaded && sha256sum --check SHA256SUMS)
          gh release edit "$tag" --draft=false --prerelease=false --latest
          gh release view "$tag" --json tagName,name,isDraft,isPrerelease,body,assets,url > ../../published.json
          cd ../..
          python3 scripts/verify-published.py published.json candidate/release-notes.md uploaded
