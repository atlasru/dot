name: patch-v008

on:
  push:
    branches: [ agent/v0.0.7-ui-state ]
    paths:
      - 'tools/patch_v008.py'
      - '.github/workflows/patch-v008.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.0.7-ui-state
      - name: Apply interface patch
        run: python3 tools/patch_v008.py
      - name: Commit generated source changes
        run: |
          git config user.name "dot. build bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/dev/dotclient/android app/build.gradle.kts
          git commit -m "Polish navigation and add themes" || exit 0
          git push origin HEAD:agent/v0.0.7-ui-state
