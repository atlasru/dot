name: android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch libXray
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://github.com/XTLS/libXray/releases/download/v26.7.28/libxray-android.zip \
            -o /tmp/libxray-android.zip
          unzip -j /tmp/libxray-android.zip '*libXray.aar' -d app/libs
          test -s app/libs/libXray.aar
          ls -lh app/libs/libXray.aar
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish tagged debug milestone
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
