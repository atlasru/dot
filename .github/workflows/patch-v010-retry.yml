name: patch-v010-retry

on:
  push:
    branches: [ agent/android-v0.1.0-happ-experiment ]
    paths:
      - '.github/workflows/patch-v010-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-v0.1.0-happ-experiment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix source milestone and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/patch_v010.py')
          s = p.read_text()
          s = s.replace('versionCode = 16\\n        versionName = "0.0.16"', 'versionCode = 17\\n        versionName = "0.0.17"')
          p.write_text(s)
          PY
          python tools/patch_v010.py
      - name: Commit generated changes
        run: |
          git config user.name "atlasru"
          git config user.email "258285264+atlasru@users.noreply.github.com"
          git add app CHANGELOG.md
          git commit -m "Android 0.1.0: unified orb and node dashboard"
          git push
