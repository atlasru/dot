name: patch-v009

on:
  push:
    branches: [ agent/v0.0.9-traffic-notification ]
    paths:
      - 'tools/patch_v009.py'
      - '.github/workflows/patch-v009.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.0.9-traffic-notification
      - name: Apply v0.0.9 UI patch
        run: python3 tools/patch_v009.py
      - name: Commit generated changes
        run: |
          git config user.name "dot. build bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/dev/dotclient/android/ui/DotApp.kt app/build.gradle.kts
          git commit -m "Add realtime traffic UI and pixel AMOLED status" || exit 0
          git push origin HEAD:agent/v0.0.9-traffic-notification
