name: Bug report
description: Report a reproducible problem in dot.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private subscription URLs, UUIDs or unredacted credentials.
  - type: input
    id: version
    attributes:
      label: dot. version
      placeholder: 0.4.0 / 0.4.0-debug
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Website
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version / device
      placeholder: Android 16 / Nothing Phone 3 or Windows 11 x64
    validations:
      required: false
  - type: dropdown
    id: protocol
    attributes:
      label: VPN protocol (when applicable)
      options:
        - Not applicable
        - VLESS
        - Hysteria2
        - Mixed subscription
        - Unknown
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error / logs
      description: Remove subscription tokens and UUIDs before posting.
