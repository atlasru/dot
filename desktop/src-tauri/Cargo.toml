[package]
name = "dot-desktop"
version = "0.1.0-alpha.1"
description = "dot. VLESS client for Windows"
authors = ["atlasru"]
edition = "2021"
rust-version = "1.84"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = { version = "2.11.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v5", "serde"] }
base64 = "0.22"
percent-encoding = "2.3"
thiserror = "2.0"
